<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypeSafe AI (Jev) - Web Playground</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-10 px-4">
  <div class="max-w-2xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="border-b border-slate-800 pb-4 text-center">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
        Jev Decision Playground
      </h1>
      <p class="text-slate-400 text-sm mt-1">
        Model Pengambilan Keputusan "System 1" (Ultra-Fast & Structured)
      </p>
    </header>

    <!-- URL Proxy Config -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-2">
      <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">
        Worker / Proxy Endpoint URL
      </label>
      <input
        id="proxyUrl"
        type="text"
        placeholder="https://typesafe-proxy.your-name.workers.dev"
        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500"
      />
      <p class="text-xs text-slate-500">Masukkan URL Cloudflare Worker yang Anda buat di Langkah 2.</p>
    </div>

    <!-- Input State -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-2">
      <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">
        Konteks Input (State)
      </label>
      <textarea
        id="inputState"
        rows="4"
        class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500"
        placeholder="Contoh: Pembayaran pengguna gagal 3 kali berturut-turut dengan kartu kredit yang berbeda."
      ></textarea>
      
      <button
        id="btnAnalyze"
        onclick="evalJev()"
        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition duration-200 flex items-center justify-center gap-2"
      >
        <span>Analisa Keputusan</span>
      </button>
    </div>

    <!-- Output Hasil -->
    <div id="resultBox" class="hidden bg-slate-900 border border-slate-800 p-5 rounded-xl space-y-4">
      <h3 class="text-base font-semibold text-slate-200 border-b border-slate-800 pb-2">
        Hasil Keputusan (Jev Primitives)
      </h3>

      <div id="resultsContent" class="space-y-4">
        <!-- Hasil akan dirender di sini secara dinamis -->
      </div>
      
      <div class="pt-2">
        <label class="text-xs text-slate-400">Raw JSON:</label>
        <pre id="rawJson" class="text-xs bg-black/60 p-3 rounded-lg overflow-x-auto text-emerald-400 font-mono mt-1"></pre>
      </div>
    </div>

  </div>

  <script>
    async function evalJev() {
      const proxyUrl = document.getElementById("proxyUrl").value.trim();
      const state = document.getElementById("inputState").value.trim();
      const btn = document.getElementById("btnAnalyze");
      const resultBox = document.getElementById("resultBox");
      const resultsContent = document.getElementById("resultsContent");
      const rawJson = document.getElementById("rawJson");

      if (!proxyUrl) {
        alert("Harap masukkan URL Proxy / Worker terlebih dahulu!");
        return;
      }
      if (!state) {
        alert("Harap masukkan teks input (state)!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Memproses (Sub-detik)...";

      // Payload 3 Primitif Jev: Choice, Noul, Score
      const payload = {
        model: "jev-latest",
        state: state,
        questions: {
          is_fraud_risk: {
            type: "noul",
            instructions: "Apakah aktivitas ini mengindikasikan potensi risiko kecurangan (fraud)?"
          },
          category: {
            type: "choice",
            instructions: "Pilih kategori masalah utama dari situasi ini",
            options: ["Billing_Issue", "Technical_Bug", "Security_Alert", "Normal_Inquiry"]
          },
          urgency_score: {
            type: "score",
            instructions: "Seberapa tinggi urgensi tindakan yang dibutuhkan?"
          }
        }
      };

      try {
        const startTime = performance.now();
        const res = await fetch(proxyUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error(`HTTP Error ${res.status}: ${await res.text()}`);

        const data = await res.json();
        const duration = Math.round(performance.now() - startTime);

        resultBox.classList.remove("hidden");
        rawJson.textContent = JSON.stringify(data, null, 2);

        // Render card interaktif
        resultsContent.innerHTML = `
          <div class="text-xs text-slate-400">Waktu respons: <span class="text-emerald-400 font-bold">${duration} ms</span></div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
              <div class="text-xs text-slate-400">Noul (Fraud Risk?)</div>
              <div class="text-lg font-bold text-amber-400 mt-1">${data.answers?.is_fraud_risk?.value ?? "-"}</div>
              <div class="text-xs text-slate-500">Confidence: ${Math.round((data.answers?.is_fraud_risk?.confidence || 0) * 100)}%</div>
            </div>
            <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
              <div class="text-xs text-slate-400">Choice (Kategori)</div>
              <div class="text-lg font-bold text-blue-400 mt-1">${data.answers?.category?.value ?? "-"}</div>
              <div class="text-xs text-slate-500">Confidence: ${Math.round((data.answers?.category?.confidence || 0) * 100)}%</div>
            </div>
            <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
              <div class="text-xs text-slate-400">Score (Urgensi)</div>
              <div class="text-lg font-bold text-purple-400 mt-1">${data.answers?.urgency_score?.value ?? "-"}</div>
              <div class="text-xs text-slate-500">Confidence: ${Math.round((data.answers?.urgency_score?.confidence || 0) * 100)}%</div>
            </div>
          </div>
        `;
      } catch (err) {
        alert("Gagal memanggil API: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Analisa Keputusan";
      }
    }
  </script>
</body>
</html>
